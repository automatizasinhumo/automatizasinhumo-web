# Empleado «actualizador» (Dependabot, gratis): PR mensuales y agrupadas.
# Mensual y no semanal: el repo es privado y cada PR gasta minutos de Actions.
# Las mayores (p. ej. Astro 7 -> 8) llegan solas para revisarlas aparte.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
