# Empleado «actualizador» (Dependabot, gratis): PR mensuales y agrupadas.
# Mensual y no semanal: el repo es privado y cada PR gasta minutos de Actions.
# Las mayores (p. ej. Astro 7 -> 8) llegan solas para revisarlas aparte.
version: 2
updates:
  - package-ecosystem: "npm"
    # Todos los lockfiles: la raíz, el MCP y las herramientas de QA fijadas (Danger, navegador).
    directories: ["/", "/mcp", "/qa/navegador", "/qa/danger"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    ignore:
      # TS 7 rompe npm ci: @astrojs/check 0.9 pide typescript ^5 || ^6 (PR #3, 18/11/2026).
      # Quitar cuando @astrojs/check acepte la 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
