name: Fábrica de vistas previas

# Solicitudes nuevas -> vista previa publicada (manual/fabrica/vistas-previas.py) y pagadas -> ZIP entregado
# (manual/fabrica/entregar.py), sin depender del PC.
# Necesita el secreto CLOUDFLARE_API_TOKEN (Workers Scripts Edit, D1 Edit, Workers AI Read, Account Settings Read)
# y las variables CLOUDFLARE_ACCOUNT_ID y D1_DATABASE_ID. Sin ellas, el trabajo falla.
# Los registros de Actions son públicos: los scripts no escriben datos ni URLs de clientes cuando GITHUB_ACTIONS existe.

on:
  schedule:
    - cron: '7-59/15 * * * *'
  workflow_dispatch:
    inputs:
      max:
        description: 'Máximo de solicitudes por pasada'
        default: '3'

permissions:
  contents: read

concurrency:
  group: fabrica-vistas-previas
  cancel-in-progress: false

jobs:
  vistas-previas:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      CI: '1'
      WRANGLER_SEND_METRICS: 'false'

    steps:
      # Sin Harden-Runner a propósito: en un repo público su informe de red es visible para cualquiera
      # y registraría el host web-<id> de cada vista previa, que identifica el pedido.

      - name: Comprobar credenciales
        id: cred
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$D1_DATABASE_ID" ]; then
            echo "listo=1" >> "$GITHUB_OUTPUT"
            echo "DEMOS_DIR=$RUNNER_TEMP/demos" >> "$GITHUB_ENV"
            echo "WRANGLER_CONFIG=$RUNNER_TEMP/fabrica-ci.wrangler.jsonc" >> "$GITHUB_ENV"
          else
            echo "::error::Faltan CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID o D1_DATABASE_ID; la fábrica no se ejecuta."
            exit 1
          fi

      - name: Obtener el repositorio
        if: steps.cred.outputs.listo == '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        if: steps.cred.outputs.listo == '1'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Configurar Python
        if: steps.cred.outputs.listo == '1'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        if: steps.cred.outputs.listo == '1'
        run: |
          npm ci --ignore-scripts
          pip install --only-binary :all: --require-hashes -r manual/fabrica/requirements-ci.txt

      - name: Instalar el navegador de la prueba funcional
        if: steps.cred.outputs.listo == '1'
        run: |
          # Paquete aparte con su propio lockfile (qa/navegador). qa/node_modules hace que
          # qa/demo-funcional.mjs lo encuentre antes que el node_modules de la raíz (Wrangler).
          npm ci --prefix qa/navegador --ignore-scripts --no-audit --no-fund
          ln -s navegador/node_modules qa/node_modules
          qa/navegador/node_modules/.bin/playwright install --with-deps chromium

      - name: Configuración de Wrangler con la D1
        if: steps.cred.outputs.listo == '1'
        run: |
          mkdir -p "$DEMOS_DIR"
          cat > "$WRANGLER_CONFIG" <<EOF
          {
            "name": "automatizasinhumo-staging",
            "compatibility_date": "2026-11-01",
            "d1_databases": [{ "binding": "DB", "database_name": "automatizasinhumo-staging-db", "database_id": "$D1_DATABASE_ID" }]
          }
          EOF

      - name: Fabricar vistas previas
        if: steps.cred.outputs.listo == '1'
        env:
          MAXIMO: ${{ inputs.max || '3' }}
        run: python -X utf8 -u manual/fabrica/vistas-previas.py --config "$WRANGLER_CONFIG" --max "$MAXIMO"

      # Solicitudes pagadas: ZIP de la vista previa aprobada en KV; el cron del Worker manda el correo «entregado».
      - name: Entregar webs pagadas
        if: ${{ !cancelled() && steps.cred.outputs.listo == '1' }}
        env:
          MAXIMO: ${{ inputs.max || '3' }}
        run: python -X utf8 -u manual/fabrica/entregar.py --config "$WRANGLER_CONFIG" --max "$MAXIMO"

  vigilancia:
    needs: vistas-previas
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      STAGING_URL: https://automatizasinhumo-staging.davidpd89.workers.dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comprobar staging
        id: staging
        run: |
          if curl -fsSL --proto =https --proto-redir =https --max-time 30 "$STAGING_URL/" -o /dev/null \
            && curl -fsSL --proto =https --proto-redir =https --max-time 30 "$STAGING_URL/robots.txt" -o /dev/null; then
            echo "estado=arriba" >> "$GITHUB_OUTPUT"
          else
            echo "estado=caido" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar acceso a D1
        id: credenciales
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$D1_DATABASE_ID" ]; then
            echo "disponible=1" >> "$GITHUB_OUTPUT"
          else
            echo "disponible=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Node.js
        if: steps.credenciales.outputs.disponible == '1'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Instalar Wrangler
        if: steps.credenciales.outputs.disponible == '1'
        run: npm ci --ignore-scripts

      - name: Actualizar avisos automáticos
        # Sin depender de la instalación de Wrangler: el aviso del staging sale aunque falle.
        if: ${{ !cancelled() }}
        env:
          ESTADO_STAGING: ${{ steps.staging.outputs.estado }}
          D1_DISPONIBLE: ${{ steps.credenciales.outputs.disponible }}
        run: |
          if [ "$D1_DISPONIBLE" = '1' ]; then
            python -X utf8 manual/fabrica/vigilancia.py --d1 --staging "$ESTADO_STAGING"
          else
            echo "::warning::Se omite la vigilancia de solicitudes porque faltan las credenciales de Cloudflare."
            python -X utf8 manual/fabrica/vigilancia.py --staging "$ESTADO_STAGING"
          fi
