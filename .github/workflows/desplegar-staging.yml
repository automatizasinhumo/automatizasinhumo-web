name: Desplegar staging

# Cada fusión en main se despliega sola en staging (antes era a mano y staging se quedaba
# atrás: el pago seguía en inglés días después de traducirlo). Después, el empleado
# «recorrido del cliente» (qa/recorrido-cliente.mjs, Playwright) hace en un navegador lo que
# hace un cliente. Los lunes repite solo el recorrido. La configuración de Wrangler se
# genera en el runner (scripts/wrangler-staging.mjs); .instances/ no se usa.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desplegar-staging
  cancel-in-progress: false

env:
  BASE: https://automatizasinhumo-staging.davidpd89.workers.dev

jobs:
  desplegar:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      desplegado: ${{ steps.deploy.outputs.desplegado }}
      anterior: ${{ steps.anterior.outputs.version }}
    steps:
      - name: Credenciales de Cloudflare
        id: cred
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1: ${{ vars.D1_DATABASE_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$CUENTA" ] && [ -n "$D1" ]; then echo "listo=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::Faltan CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID o D1_DATABASE_ID: no se despliega."; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cred.outputs.listo == '1'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.cred.outputs.listo == '1'
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        if: steps.cred.outputs.listo == '1'
        run: npm ci --ignore-scripts

      - name: Configuración de staging
        if: steps.cred.outputs.listo == '1'
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: node scripts/wrangler-staging.mjs

      # Versión activa antes de desplegar: destino fijo de la vuelta atrás, para que
      # reejecutar el job no devuelva staging a la versión rota.
      - name: Versión anterior
        id: anterior
        if: steps.cred.outputs.listo == '1'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          v=$(npx wrangler deployments status --name automatizasinhumo-staging --json             | python3 -c 'import json,sys; d=json.load(sys.stdin); print(max(d["versions"], key=lambda x: x["percentage"])["version_id"])')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Construir, migrar y desplegar
        id: deploy
        if: steps.cred.outputs.listo == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run deploy
          echo "desplegado=1" >> "$GITHUB_OUTPUT"

  recorrido:
    needs: desplegar
    if: ${{ always() && needs.desplegar.result != 'failure' && needs.desplegar.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      roto: ${{ steps.recorrido.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Instalar Playwright
        run: |
          # Paquete aparte con su propio lockfile (qa/navegador): versión e integridad fijadas.
          npm ci --prefix qa/navegador --ignore-scripts --no-audit --no-fund
          ln -s qa/navegador/node_modules node_modules
          qa/navegador/node_modules/.bin/playwright install --with-deps chromium

      - name: Recorrido del cliente
        id: recorrido
        # Un segundo intento antes de dar la versión por rota: un fallo suelto de red no
        # debe deshacer un despliegue bueno.
        run: node qa/recorrido-cliente.mjs "$BASE" || { sleep 30; node qa/recorrido-cliente.mjs "$BASE"; }

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: capturas-recorrido
          path: capturas/
          if-no-files-found: ignore
          retention-days: 14

  # Si el recorrido falla tras un despliegue, staging vuelve a la versión anterior
  # (wrangler rollback). Las migraciones de D1 no se deshacen: son siempre aditivas.
  volver-atras:
    needs: [desplegar, recorrido]
    if: ${{ always() && needs.desplegar.outputs.desplegado == '1' && needs.recorrido.outputs.roto == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Volver a la versión anterior
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
          ANTERIOR: ${{ needs.desplegar.outputs.anterior }}
        run: |
          # Con la versión anotada antes de desplegar; si no se pudo leer, la anterior por defecto.
          npm i -g --ignore-scripts --no-audit --no-fund wrangler@4.164.0
          wrangler rollback ${ANTERIOR:+"$ANTERIOR"} --name automatizasinhumo-staging -y -m "Recorrido fallido tras desplegar ${SHA:0:7}"
          echo "::error::El recorrido falló: staging ha vuelto a la versión anterior. Revisa las capturas del job recorrido."
