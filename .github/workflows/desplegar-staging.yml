name: Desplegar staging

# Cada fusión en main se despliega sola en staging (antes era a mano y staging se quedaba
# atrás: el pago seguía en inglés días después de traducirlo). Después, el empleado
# «recorrido del cliente» (qa/recorrido-cliente.mjs, Playwright) hace en un navegador lo que
# hace un cliente. Los lunes repite solo el recorrido. La configuración de Wrangler se
# genera en el runner (scripts/wrangler-staging.mjs); .instances/ no se usa.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desplegar-staging
  cancel-in-progress: false

env:
  BASE: https://automatizasinhumo-staging.davidpd89.workers.dev

jobs:
  desplegar:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      desplegado: ${{ steps.deploy.outputs.desplegado }}
      anterior: ${{ steps.anterior.outputs.version }}
    steps:
      - name: Credenciales de Cloudflare
        id: cred
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1: ${{ vars.D1_DATABASE_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$CUENTA" ] && [ -n "$D1" ]; then echo "listo=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::Faltan CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID o D1_DATABASE_ID: no se despliega."; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cred.outputs.listo == '1'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.cred.outputs.listo == '1'
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        if: steps.cred.outputs.listo == '1'
        run: npm ci --ignore-scripts

      - name: Configuración de staging
        if: steps.cred.outputs.listo == '1'
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: node scripts/wrangler-staging.mjs

      # Versión activa antes de desplegar: destino fijo de la vuelta atrás, para que
      # reejecutar el job no devuelva staging a la versión rota.
      - name: Versión anterior
        id: anterior
        if: steps.cred.outputs.listo == '1'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          v=$(npx wrangler deployments status --name automatizasinhumo-staging --json             | python3 -c 'import json,sys; d=json.load(sys.stdin); print(max(d["versions"], key=lambda x: x["percentage"])["version_id"])')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Construir, migrar y desplegar
        id: deploy
        if: steps.cred.outputs.listo == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run deploy
          echo "desplegado=1" >> "$GITHUB_OUTPUT"

      # El carrito guarda ids públicos (prod_x:var_y) que salen de autoservicio.json; si
      # la D1 conserva ids o precios viejos, resolveCart descarta la línea y el carrito
      # sale vacío. Este paso iguala la D1 al catálogo en cada despliegue (idempotente).
      - name: Sincronizar catálogo con la D1
        if: steps.deploy.outputs.desplegado == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node manual/catalogo/gen-update.mjs > "$RUNNER_TEMP/catalogo-update.sql"
          npx wrangler d1 execute automatizasinhumo-staging-db --remote --yes --file "$RUNNER_TEMP/catalogo-update.sql"

  # Portada nueva (tema «limpio») en su propio Worker, con la misma D1 de staging: se
  # construye desde cero sin tocar la web actual, que sigue de referencia en BASE.
  # Va después de «desplegar» para no aplicar migraciones a la vez.
  portada-limpia:
    needs: desplegar
    if: ${{ needs.desplegar.outputs.desplegado == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      URL_PORTADA: https://automatizasinhumo-limpio.davidpd89.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Configuración del Worker de la portada nueva
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          STAGING_WORKER: automatizasinhumo-limpio
        run: node scripts/wrangler-staging.mjs

      - name: Construir y desplegar con el tema limpio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          THEME: limpio
        run: npm run deploy

      - name: Comprobar la portada
        run: |
          for _ in 1 2 3 4 5 6; do
            if curl -fsS "$URL_PORTADA/" | grep -q 'id="portada-titulo"'; then echo "Portada nueva servida en $URL_PORTADA"; exit 0; fi
            sleep 10
          done
          echo "::error::$URL_PORTADA no sirve la portada nueva"; exit 1

      - name: Instalar Playwright
        run: |
          npm ci --prefix qa/navegador --ignore-scripts --no-audit --no-fund
          mkdir -p node_modules
          for p in playwright playwright-core; do ln -sfn "$PWD/qa/navegador/node_modules/$p" "node_modules/$p"; done
          qa/navegador/node_modules/.bin/playwright install --with-deps chromium

      - name: Contrato de diseño
        run: node qa/contrato-diseno.mjs "$URL_PORTADA"

      # La portada nueva vende con el mismo carrito y los mismos formularios: el cliente
      # debe poder llegar, contratar y pedir también aquí.
      - name: Recorrido del cliente
        run: node qa/recorrido-cliente.mjs "$URL_PORTADA" || { sleep 30; node qa/recorrido-cliente.mjs "$URL_PORTADA"; }

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: capturas-recorrido-limpio
          path: capturas/
          if-no-files-found: ignore
          retention-days: 14

  recorrido:
    needs: desplegar
    if: ${{ always() && needs.desplegar.result != 'failure' && needs.desplegar.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      roto: ${{ steps.recorrido.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Instalar Playwright
        run: |
          # Paquete aparte con su propio lockfile (qa/navegador): versión e integridad fijadas.
          npm ci --prefix qa/navegador --ignore-scripts --no-audit --no-fund
          ln -s qa/navegador/node_modules node_modules
          qa/navegador/node_modules/.bin/playwright install --with-deps chromium

      - name: Recorrido del cliente
        id: recorrido
        # Un segundo intento antes de dar la versión por rota: un fallo suelto de red no
        # debe deshacer un despliegue bueno.
        run: node qa/recorrido-cliente.mjs "$BASE" || { sleep 30; node qa/recorrido-cliente.mjs "$BASE"; }

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: capturas-recorrido
          path: capturas/
          if-no-files-found: ignore
          retention-days: 14

  # Si el recorrido falla tras un despliegue, staging vuelve a la versión anterior
  # (wrangler rollback). Las migraciones de D1 no se deshacen: son siempre aditivas.
  volver-atras:
    needs: [desplegar, recorrido]
    if: ${{ always() && needs.desplegar.outputs.desplegado == '1' && needs.recorrido.outputs.roto == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Volver a la versión anterior
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
          ANTERIOR: ${{ needs.desplegar.outputs.anterior }}
        run: |
          # Con la versión anotada antes de desplegar; si no se pudo leer, la anterior por defecto.
          npm i -g --ignore-scripts --no-audit --no-fund wrangler@4.164.0
          wrangler rollback ${ANTERIOR:+"$ANTERIOR"} --name automatizasinhumo-staging -y -m "Recorrido fallido tras desplegar ${SHA:0:7}"
          echo "::error::El recorrido falló: staging ha vuelto a la versión anterior. Revisa las capturas del job recorrido."
