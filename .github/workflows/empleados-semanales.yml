name: Empleados semanales (staging)

# Revisores gratuitos que corren cada lunes y a mano. Cada uno reutiliza una
# herramienta pública mantenida; aquí solo está el pegamento. Ficha de cada
# empleado (qué mira, qué hacer con el aviso): manual/EMPLEADOS.md.
#   - unlighthouse  (harlan-zw/unlighthouse, MIT): Lighthouse de TODA la web, no solo 6 URLs
#   - observatory   (mdn/mdn-http-observatory, MPL-2.0): nota de cabeceras de seguridad
#   - corrector     (LanguageTool, LGPL): erratas en los textos del catálogo (manual/catalogo)
#   - navegadores   (microsoft/playwright, Apache-2.0): Chromium + Firefox + WebKit, 360/1280 px
#   - html          (html-validate, MIT): HTML válido y accesible en todas las URL del sitemap
#   - idioma-demos  (cheerio, MIT): las demos públicas en español de España (C20)
#   - zap           (zaproxy/action-baseline, Apache-2.0): DAST pasivo del staging
#   - presupuesto-web (sitespeedio/sitespeed.io, MIT): peso y tiempos por página (qa/perf-budget.json)
#   - nuclei        (projectdiscovery/nuclei-action, MIT): exposiciones y mala configuración
# Solo «navegadores», «html» e «idioma-demos» pueden poner el run en rojo; el resto avisa en el resumen.

on:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: empleados-semanales
  cancel-in-progress: true

env:
  BASE: https://automatizasinhumo-staging.davidpd89.workers.dev
  HOST: automatizasinhumo-staging.davidpd89.workers.dev

jobs:
  unlighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Lighthouse de toda la web (muestreo por plantilla de URL)
        run: |
          # staging tiene robots «Disallow: /» a propósito: se ignora y se usa el sitemap.
          # Herramientas con versión e integridad fijadas (qa/herramientas); scripts de instalación
          # solo los de la lista: aquí, la descarga del navegador de puppeteer.
          npm ci --prefix qa/herramientas --ignore-scripts --no-audit --no-fund
          npm rebuild --prefix qa/herramientas puppeteer
          qa/herramientas/node_modules/.bin/unlighthouse-ci --site "$BASE" --disable-robots-txt \
            --sitemaps "$BASE/sitemap.xml" --samples 1 --reporter jsonExpanded \
            --build-static --output-path ul || true
          node -e '
            const fs=require("fs"); const f=["ul/ci-result.json"].find(fs.existsSync);
            if(!f){console.log("sin resultados");process.exit(0)}
            const r=JSON.parse(fs.readFileSync(f,"utf8")); const rows=(r.routes||r).map(x=>[x.path,x.score,...["performance","accessibility","best-practices","seo"].map(k=>x.categories?.[k]?.score)]);
            rows.sort((a,b)=>(a[1]??1)-(b[1]??1));
            const md=["## Unlighthouse: "+rows.length+" páginas (peores primero)","","| Ruta | Total | Rend. | Acces. | Buenas pr. | SEO |","|---|---|---|---|---|---|",...rows.slice(0,40).map(r=>"| "+r.map(v=>typeof v==="number"?Math.round(v*100):v).join(" | ")+" |")].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,md+"\n"); console.log(md)'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unlighthouse
          path: ul/
          if-no-files-found: ignore
          retention-days: 14

  observatory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Cabeceras de seguridad (Mozilla HTTP Observatory)
        run: |
          # Scripts permitidos: listas HSTS/TLD del observatorio y su almacén de certificados.
          npm ci --prefix qa/herramientas --ignore-scripts --no-audit --no-fund
          npm rebuild --prefix qa/herramientas @mdn/mdn-http-observatory node_extra_ca_certs_mozilla_bundle
          qa/herramientas/node_modules/.bin/mdn-http-observatory-scan "$HOST" > obs.json || true
          node -e '
            const fs=require("fs"); let r; try{r=JSON.parse(fs.readFileSync("obs.json","utf8"))}catch{console.log(fs.readFileSync("obs.json","utf8"));process.exit(0)}
            const s=r.scan||r; const t=Object.values(r.tests||{}).filter(x=>!x.pass);
            const md=["## Observatory: nota "+s.grade+" ("+s.score+"/100)","",...t.map(x=>"- **"+x.name+"**: "+x.result+" ("+x.scoreModifier+")")].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,md+"\n"); console.log(md)'

  corrector:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      languagetool:
        image: erikvl87/languagetool:latest
        ports:
          - 8010:8010
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Esperar a LanguageTool
        run: for _ in $(seq 1 60); do curl -sf "http://localhost:8010/v2/languages" > /dev/null && break; sleep 2; done
      - run: node qa/ortografia.mjs http://localhost:8010
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ortografia
          path: ortografia.json
          if-no-files-found: ignore
          retention-days: 14

  navegadores:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Instalar Playwright (fuera del package.json de la tienda)
        run: |
          # Paquete aparte con su propio lockfile (qa/navegador): versión e integridad fijadas.
          npm ci --prefix qa/navegador --ignore-scripts --no-audit --no-fund
          ln -s qa/navegador/node_modules node_modules
          qa/navegador/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - run: node qa/navegadores.mjs "$BASE" qa/urls-navegadores.txt
      - run: node qa/buscador-movil.mjs "$BASE"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: capturas
          path: capturas/
          if-no-files-found: ignore
          retention-days: 14

  html:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: HTML de todas las URL del sitemap
        run: |
          mkdir -p html && i=0
          for u in $(curl -s "$BASE/sitemap.xml" | grep -oE '<loc>[^<]+' | cut -c6- | sort -u); do
            i=$((i+1)); curl -s "$u" > "html/$(printf %03d $i).html"; echo "$(printf %03d $i) $u" >> html/urls.txt
          done
          echo "$i páginas"
          npm ci --prefix qa/herramientas --ignore-scripts --no-audit --no-fund
          set +e; qa/herramientas/node_modules/.bin/html-validate -c qa/htmlvalidate.json -f text html/*.html > hv.txt; rc=$?; set -e
          { echo "## html-validate: $i páginas, $(grep -c ' error ' hv.txt) errores"; echo; echo '```'
            sed -E 's#^html/##' hv.txt | head -60; echo '```'; echo; echo '<details><summary>Número → URL</summary>'; echo; sed 's/^/    /' html/urls.txt; echo '</details>'; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc

  axe:
    # Segundo motor de accesibilidad (axe-core de Deque) con el mismo pa11y-ci, sobre todo el sitemap. Solo avisa.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: axe-core en todas las URL del sitemap
        run: |
          mapfile -t urls < <(curl -s "$BASE/sitemap.xml" | grep -oE '<loc>[^<]+' | cut -c6- | sort -u)
          npm ci --prefix qa/herramientas --ignore-scripts --no-audit --no-fund
          npm rebuild --prefix qa/herramientas puppeteer
          # pa11y-ci 5 ya no tiene --runner: el motor va en la configuración (copia de .pa11yci con axe).
          node -e 'const f=require("fs");const c=JSON.parse(f.readFileSync(".pa11yci","utf8"));c.defaults.runners=["axe"];f.writeFileSync("pa11yci-axe.json",JSON.stringify(c))'
          set +e; qa/herramientas/node_modules/.bin/pa11y-ci --config pa11yci-axe.json "${urls[@]}" > axe.txt 2>&1; set -e
          { echo "## axe-core: ${#urls[@]} páginas"; echo; echo '```'; grep -vE '^\s*$' axe.txt | tail -80; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  knip:
    # Código muerto: ficheros, exports y dependencias sin uso (knip). Solo avisa.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: knip
        run: |
          npm ci --prefix qa/herramientas --ignore-scripts --no-audit --no-fund
          set +e; qa/herramientas/node_modules/.bin/knip --no-progress --reporter markdown > knip.md 2>&1; set -e
          { echo "## knip (código muerto)"; echo; head -150 knip.md; } | tee -a "$GITHUB_STEP_SUMMARY"

  idioma-demos:
    # Si falla: node manual/demos/localizar-demos.mjs y desplegar las demos (manual/demos).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/demos/idioma.mjs --json idioma-demos.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: idioma-demos
          path: idioma-demos.json
          if-no-files-found: ignore
          retention-days: 14

  zap:
    # DAST pasivo (zaproxy/action-baseline, Apache-2.0): araña el staging y señala cabeceras, cookies y
    # fugas que solo se ven con la web desplegada. Solo avisa: informe en el artefacto zap_scan.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        continue-on-error: true # código 3 (no pudo analizar) también es solo aviso
        with:
          target: ${{ env.BASE }}
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-a -m 5'

  presupuesto-web:
    # Presupuesto de peso y tiempos por página (sitespeedio/sitespeed.io, MIT), límites en qa/perf-budget.json.
    # Complementa a Lighthouse: falla por kB y peticiones, no por nota. Solo avisa.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: sitespeed.io con presupuesto
        run: |
          sed "s#^#$BASE#" qa/urls.txt > urls-abs.txt
          set +e
          docker run --rm --shm-size=1g -v "$PWD:/sitespeed.io" sitespeedio/sitespeed.io:43.0.0 \
            urls-abs.txt --budget.configPath qa/perf-budget.json -b chrome -n 3 --outputFolder sitespeed-result > sitespeed.log 2>&1
          code=$?; set -e
          { echo "## sitespeed.io: presupuesto (salida $code)"; echo; echo '```'; grep -iE 'budget|fail|pass|error' sitespeed.log | tail -60; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: sitespeed
          path: sitespeed-result
          if-no-files-found: ignore
          retention-days: 7

  nuclei:
    # Plantillas de exposición y mala configuración (projectdiscovery/nuclei-action, MIT). Solo avisa.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: projectdiscovery/nuclei-action@32a91c0da7be14c07b0ade6c14fa0f6e78d97c9c # v3.1.0
        id: nuclei
        continue-on-error: true
        with:
          args: -u ${{ env.BASE }} -tags misconfig,exposure -severity medium,high,critical -silent -o nuclei.txt -rl 20
      - name: Resumen
        if: always()
        run: |
          {
            echo "## nuclei: exposiciones y mala configuración"; echo
            if [ "$RESULTADO" != success ]; then echo "⚠️ El análisis no terminó ($RESULTADO): sin datos, no «sin hallazgos»."
            elif [ -s nuclei.txt ]; then echo '```'; head -80 nuclei.txt; echo '```'
            else echo 'Sin hallazgos.'; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          RESULTADO: ${{ steps.nuclei.outcome }}
