name: Danger

# Reglas de negocio de cada PR (dangerfile.js): avisa de la evidencia que falta
# (prueba de compra, precio, contacto) y solo bloquea si package.json y su lockfile divergen.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: danger-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  danger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # Instalación fija y sin scripts de ciclo de vida, fuera del árbol del repo
      # (npx podría instalar y ejecutar scripts bajo demanda: Sonar S6505).
      - name: Instalar Danger
        run: npm install --prefix "$RUNNER_TEMP/danger" --ignore-scripts --no-audit --no-fund danger@14.1.0

      - name: Danger
        run: '"$RUNNER_TEMP/danger/node_modules/.bin/danger" ci --failOnErrors'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
