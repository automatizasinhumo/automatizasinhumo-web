name: Vigilantes de la cadena de suministro

# Empleados adoptados tal cual (acciones oficiales, sin lógica propia):
#   - zizmor (zizmorcore/zizmor-action, MIT): audita los workflows de Actions (inyección,
#     permisos de más, acciones sin fijar). Resultados en Security → Code scanning.
#   - Dependency Review (actions/dependency-review-action, MIT): en cada PR bloquea dependencias
#     nuevas con vulnerabilidad alta o con licencia fuera de la lista admitida (norma de adopción).
#   - actionlint (rhysd/actionlint, MIT): un workflow con YAML o expresiones inválidas no llega a
#     main (antes solo se veía al fallar el run). Binario oficial con SHA-256 fijado.
#   - OpenSSF Scorecard (ossf/scorecard-action, Apache-2.0): nota semanal de prácticas de
#     seguridad del repo. Resultados en Code scanning.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: vigilantes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      VERSION: 1.7.12
      SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          f="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$f" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/$f"
          echo "$SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  licencias:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # Todos los alcances: una dependencia de desarrollo con vulnerabilidad o licencia vetada
          # también cuenta (por defecto solo se mira runtime).
          fail-on-scopes: runtime, development, unknown
          # OFL-1.1: licencia de tipografías (@fontsource/*); permite incrustarlas en webs y PDF.
          allow-licenses: MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, Unlicense, BlueOak-1.0.0, Python-2.0, CC-BY-4.0, OFL-1.1
          # Resumen siempre en la PR: las licencias sin identificar (NOASSERTION) no hacen fallar la
          # acción, así quedan a la vista para revisarlas antes de fusionar.
          comment-summary-in-pr: always
          # GHSA-fc5q-39xc-vjpf (picomatch <= 4.0.7) lo retiró GitHub el 18-11-2026; la acción aún lo
          # marca. Quitar esta línea cuando deje de aparecer en «Vulnerabilities».
          allow-ghsas: GHSA-fc5q-39xc-vjpf
          # Herramientas de QA de qa/herramientas: solo se ejecutan en el runner, no se distribuyen
          # ni se incluyen en la web, así que su licencia (MPL, LGPL, PSF, FSL…) no obliga a nada.
          # Excepción por paquete, no por licencia: una dependencia nueva de la web con esas
          # licencias sigue fallando.
          allow-dependencies-licenses: >-
            pkg:npm/@mdn/mdn-http-observatory, pkg:npm/argparse, pkg:npm/axe-core,
            pkg:npm/lightningcss, pkg:npm/lightningcss-android-arm64, pkg:npm/lightningcss-darwin-arm64,
            pkg:npm/lightningcss-darwin-x64, pkg:npm/lightningcss-freebsd-x64,
            pkg:npm/lightningcss-linux-arm-gnueabihf, pkg:npm/lightningcss-linux-arm64-gnu,
            pkg:npm/lightningcss-linux-arm64-musl, pkg:npm/lightningcss-linux-x64-gnu,
            pkg:npm/lightningcss-linux-x64-musl, pkg:npm/lightningcss-win32-arm64-msvc,
            pkg:npm/lightningcss-win32-x64-msvc, pkg:npm/nan, pkg:npm/pa11y, pkg:npm/pa11y-ci,
            pkg:npm/sentry, pkg:npm/truncate-utf8-bytes

  scorecard:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4
        with:
          sarif_file: scorecard.sarif
