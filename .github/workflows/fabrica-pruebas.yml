name: Pruebas de la fábrica

# Pruebas sin red ni IA de manual/fabrica (los datos del pedido entran escapados en la vista previa).

on:
  pull_request:
    paths:
      - 'manual/fabrica/**'
      - '.github/workflows/fabrica-pruebas.yml'
  push:
    branches: [main]
    paths:
      - 'manual/fabrica/**'

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install --only-binary :all: --require-hashes -r manual/fabrica/requirements-ci.txt

      - name: Pruebas
        run: python -m unittest discover -s manual/fabrica -v
