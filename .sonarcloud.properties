# SonarCloud (análisis automático). Los tests repiten preparación y aserciones a propósito
# (cada caso se lee solo): no cuentan para la duplicación del código nuevo, que sí vigila src/.
# Lo generado (seed.sql sale de catalogo.mjs con gen-sql.mjs) tampoco: sus INSERT se parecen
# por construcción; se revisa la fuente, no la salida.
# Los temas (src/themes/<id>/) son copias completas a propósito: scripts/check-themes.mjs prohíbe
# que un tema importe de otro, así que uno nuevo nace duplicando default.
# cv-estudio/src/adoptado/: tablas de datos copiadas de Reactive Resume (mismas filas por forma).
sonar.cpd.exclusions=cv-estudio/src/adoptado/**,**/*.test.*,**/*.spec.*,test/**,tests/**,**/*.sql,manual/catalogo/seed.sql,src/themes/**

# Código de terceros copiado sin cambios de fondo (Reactive Resume, MIT, en cv-estudio/vendor/) y
# su salida compilada y minificada (public/cv/estudio/motor/): se revisa aguas arriba; aquí solo
# cuenta nuestro código (cv-estudio/src/ y src/). Los parches locales van marcados «Local».
# cv-estudio/vendor-import/: lectores de PDF/Word/LinkedIn de Reactive Resume (MIT), igual que vendor/.
sonar.exclusions=cv-estudio/vendor/**,cv-estudio/vendor-import/**,public/cv/estudio/motor/**
